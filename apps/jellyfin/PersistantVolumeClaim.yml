---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config-v2
  namespace: jellyfin
spec:
  accessModes:
   - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: "5Gi"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache-v2
  namespace: jellyfin
spec:
  accessModes:
   - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: "5Gi"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-media
  namespace: jellyfin
spec:
  accessModes:
   - ReadWriteMany
  storageClassName: longhorn-rwx-1-replicas
  resources:
    requests:
      storage: "600Gi"