apiVersion: v1
kind: Service
metadata:
  name: deathstar
  labels:
    app.kubernetes.io/name: deathstar
    bgp-pool: pool-1
    advertise: bgp
  annotations:
    "lbipam.cilium.io/ips": "192.168.255.0"
spec:
  type: LoadBalancer
  loadBalancerClass: "io.cilium/bgp-control-plane"  
  ports:
  - port: 80
  selector:
    org: empire
    class: deathstar